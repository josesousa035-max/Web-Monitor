name: Validate and package desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            artifact: Web-Monitor-Windows-x64
          - os: macos-14
            target: --mac --arm64
            artifact: Web-Monitor-macOS-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:report
      - run: npm run test:desktop
      - run: npm run benchmark
      - run: npm run dist -- ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run verify:win
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        id: desktop-artifact
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-portable.exe
            dist/*.dmg
            dist/SHA256SUMS.txt
            dist/LEIA-ME-Windows.md
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Instruções de download Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.desktop-artifact.outputs.artifact-url }}
        run: |
          @"
          ## Web Monitor — Windows x64
          [Descarregar executáveis e hashes SHA-256]($env:ARTIFACT_URL)

          Extraia o ZIP e escolha setup.exe (instalador) ou portable.exe (sem instalação).
          Edição de desenvolvimento sem assinatura digital. O teste Electron da fonte e a verificação do pacote passaram neste job; instalação/atualização/desinstalação manual ainda por validar.
          Os dados da edição portable continuam em APPDATA/web-monitor, partilhados com a edição instalada.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report-${{ matrix.os }}
          path: |
            dist/reports/*.xml
            dist/preview.html
          if-no-files-found: warn
